name: Temporary Academy Polish

on:
  push:
    branches:
      - polish/academy-content-and-brand
    paths:
      - scripts/tmp-academy-polish.mjs
      - scripts/tmp-capture-current-academy.mjs
      - .github/workflows/tmp-academy-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/academy-content-and-brand
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Apply branding and Arabic text normalization
        run: node scripts/tmp-academy-polish.mjs
      - name: Build and verify Academy
        run: npm run build
      - name: Install Playwright for current screenshots
        run: npm install --no-save --package-lock=false playwright@1.55.0 && npx playwright install chromium
      - name: Serve built site
        run: |
          python3 -m http.server 4173 >/tmp/academy-server.log 2>&1 &
          echo $! > /tmp/academy-server.pid
          sleep 2
      - name: Capture current Academy screenshots
        run: node scripts/tmp-capture-current-academy.mjs
      - name: Normalize generated text after build
        run: node scripts/tmp-academy-polish.mjs
      - name: Commit Academy polish and current screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "polish: refresh academy branding, text, and current media"
          git push origin HEAD:polish/academy-content-and-brand
