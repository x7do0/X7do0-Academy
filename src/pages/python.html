<div class="course-shell">
    {{courseSidebar}}
    <main class="course-main">
        <header id="course-overview" class="course-header">
            <div class="course-header__icon"><i class="fab fa-python" aria-hidden="true"></i></div>
            <div>
                <h1>دروس بايثون</h1>
                <p>شرح عملي منظم مع أمثلة وملفات الموضوع والتحدي.</p>
            </div>
        </header>

        <section class="course-topics" aria-labelledby="course-topics-title">
            <div class="course-topics__heading">
                <div>
                    <span>نظرة عامة</span>
                    <h2 id="course-topics-title">المواضيع البرمجية</h2>
                </div>
                <p>اختر أي موضوع لعرض شرحه وملفاته بالتفصيل.</p>
            </div>
            <div id="course-topics-grid" class="course-topics-grid"></div>
        </section>

        <section id="lessons" class="lesson-workspace" aria-label="دروس أساسيات بايثون">
            <aside class="lesson-index">
                <div class="lesson-index__header">
                    <h2>الدروس</h2>
                    <span>12 درساً</span>
                </div>
                <nav id="lesson-list" aria-label="قائمة الدروس"></nav>
            </aside>
            <article id="lesson-viewer" class="lesson-viewer" aria-live="polite"></article>
        </section>
    </main>
</div>
